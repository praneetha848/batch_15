version: 2
sources:
    - name: datafeed_shared_schema
      database: "{{('DI_SALES')}}"
      schema: raw_schema
      tables:
        - name: raw_customerdata
        - name: raw_order
          columns:
            - name: id
              tests:
                - unique
                - not_null
            - name: status
              tests:
                - accepted_values:
                   values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
        - name: customers
        - name: emp

   